may mali ata haha <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mini Pokémon RPG — Mobile</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
/* ================= GLOBAL ================= */
html, body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:'Press Start 2P', monospace;
  display:block;  /* instead of flex */
}


/* ================= UI BUTTONS ================= */
#viewToggleBtn, #menuToggleBtn {
  position: fixed;
  z-index: 1100;
  padding: 6px 12px;
  font-size: 12px;
  background: #ffcb05;
  color: #000;
  border:2px solid #333;
  border-radius:6px;
  cursor: pointer;
  box-shadow: 2px 2px 0 #555;
}
#viewToggleBtn { top:12px; right:12px; }
#menuToggleBtn { top:12px; left:10px; }

#gbaScreen {
  width: 100%;
  min-width: 320px;  /* small phones */
  height: 100%;
  padding: 40px 4px 4px 4px;
  box-sizing: border-box;
  margin: 0 auto;
}



.gba-shell {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  gap: 4px;
  background: none; /* important */
}
.battle-container {
  flex: 0.85;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;

  /* Set the background image */
  background: url('img/bg.png') no-repeat center center;
  background-size: cover; /* ensure it fills the container */

  border: 4px solid #333;
  border-radius: 8px;
  box-shadow: 4px 4px 0 #555;
  padding: 4px;
  box-sizing: border-box;
}






.enemy-sprite, .player-sprite {
  object-fit: contain;
  position: absolute;
}

.enemy-sprite {
  top: 1%;
  left: 70%;
  transform: translateX(-50%);
  width: 300px;   /* increase size */
  height: auto;
}

.player-sprite {
  bottom: .5%;
  left: 20%;
  transform: translateX(-50%) scaleX(-1);
  width: 35%; /* control size dito */
  height: auto;
}

.hp-box {
  background: #eee;
  padding: 2px 4px;  /* konting padding */
  width: 240px;       /* auto-adjust sa content */
  min-width: 100px;  /* hindi sobrang liit */
  max-width: 220px;  /* hindi sobrang laki */
  box-sizing: border-box;
  border: 2px solid #333;
  border-radius: 4px;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  position: absolute;
}

.hp-box .name-level {
  font-size: 9px;       /* maliit na text */
  font-weight: normal;  /* hindi bold */
  text-align: center;
  white-space: nowrap;  /* hindi mag-wrap sa next line */
}

.hp-text {
  font-size: 8px;
  text-align: center;
}

.enemy-hp-box { top:0; left:0; }
.player-hp-box { bottom:0; right:0; }

.bars-row {
  display:flex;
  flex-direction: column;
  gap:2px;
  width:100%;
}
.hp-bar-outer {
  background:#ccc;
  width:100%;
  height:10px;
  border:1px solid #333;
  border-radius:2px;
  overflow:hidden;
}
.hp-bar-inner { height:100%; width:100%; }
.hp-green { background:#0f0; }
.hp-blue { background:#00f; }
.hp-text { font-size:10px; margin-top:2px; text-align:center; }

/* ================= MESSAGE BOX ================= */
.message-box {
  height:20%;
  width:98%;
  background:#f5f5f5;
  border:2px solid #333;
  border-radius:4px;
  padding:4px;
  font-size:12px;
  display:flex;
  flex-direction: column;
  justify-content: flex-end;
  box-shadow:2px 2px 0 #555;
  overflow-y:auto;
  text-align:left;
  gap:2px;
}

/* ================= MOVES / BATTLE MENU ================= */
.moves-box {
  height:35%;
  width:100%;
  background:#f0f0f0;
  border:2px solid #333;
  border-radius:4px;
  padding:4px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  gap:4px;
  box-shadow:2px 2px 0 #555;
}
.move-buttons {
  display:flex;
  justify-content:space-between;
  gap:4px;
}
.move-buttons button {
  flex:1;
  margin:0;
  padding:12px 0;
  font-size:16px;
  background:#ffcb05;
  border:2px solid #333;
  border-radius:6px;
  cursor:pointer;
  box-shadow:2px 2px 0 #555;
}
.move-buttons button:hover { background:#ffd34d; }

.menu-content {
  margin:5% auto;
  width:90%;
  max-width:400px;
  background: linear-gradient(to bottom, #f5f5f5 0%, #e0e0e0 100%);
  border: 4px solid #333;
  border-radius: 10px;
  padding: 12px;
  box-shadow: 4px 4px 0 #555;
  color: #000;
  font-size: 12px;
  text-align: left;
  position: relative;
}

.menu-bar {
  display:flex;
  gap:6px;
  margin-bottom:10px;
}
.menu-bar button {
  flex:1;
  padding:6px 8px;
  font-size:12px;
  background:#ffcb05;
  color:#000;
  border:2px solid #333;
  border-radius:4px;
  cursor:pointer;
  text-align:center;
  box-shadow:1px 1px 0 #555;
}
.menu-bar button:hover { background:#ffd34d; }

.menu-section {
  margin-bottom:12px;
  border-bottom:2px solid #333;
  padding:8px;
  background:#fdfdfd;
  border-radius:6px;
  box-shadow: inset 0 0 2px rgba(0,0,0,0.3);
  display:none;
}

.menu-section h3 {
  margin:0 0 6px 0;
  font-size:14px;
  color:#222;
  text-shadow:1px 1px 0 #fff;
}

.menu-section button {
  display:block;
  width:100%;
  margin-bottom:4px;
  padding:6px 8px;
  font-size:12px;
  background:#ffcb05;
  border:2px solid #333;
  border-radius:4px;
  cursor:pointer;
  box-shadow:1px 1px 0 #555;
  text-align:center;
}
.menu-section button:hover { background:#ffd34d; }

/* Uniform grid for items if needed */
#itemsDisplay, #shopItems, #storageDisplay, #regionButtons, #mapButtons {
  display:grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap:4px;
}




/* ================= MENU OVERLAY / POPUP ================= */
#menuOverlay {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.6);
  z-index:1000;
  display:none;
  justify-content: center;
  align-items: center;
}

.menu-content {
  width:90%;
  max-width:400px;
  background: linear-gradient(to bottom, #f5f5f5 0%, #e0e0e0 100%);
  border:4px solid #333;
  border-radius:10px;
  padding:12px;
  box-shadow:4px 4px 0 #555;
  color:#000;
  font-size:12px;
  position: relative;
}

/* Menu tabs */
.menu-bar {
  display:flex;
  gap:6px;
  margin-bottom:10px;
}
.menu-bar button {
  flex:1;
  padding:6px 8px;
  font-size:12px;
  background:#ffcb05;
  color:#000;
  border:2px solid #333;
  border-radius:4px;
  cursor:pointer;
  text-align:center;
  box-shadow:1px 1px 0 #555;
}
.menu-bar button:hover { background:#ffd34d; }

/* Menu sections */
.menu-section {
  display:none;
  margin-bottom:12px;
  border-bottom:2px solid #333;
  padding:8px;
  background:#fdfdfd;
  border-radius:6px;
  box-shadow: inset 0 0 2px rgba(0,0,0,0.3);
}

.menu-section button {
  display:block;
  width:100%;
  margin-bottom:4px;
  padding:6px 8px;
  font-size:12px;
  background:#ffcb05;
  border:2px solid #333;
  border-radius:4px;
  cursor:pointer;
  box-shadow:1px 1px 0 #555;
  text-align:center;
}
.menu-section button:hover { background:#ffd34d; }



/* Battle menu fixes */
.battle-submenu {
  display: none; /* hidden by default */
  flex-direction: column;
  gap: 4px;
  width: 100%;
}

.menu-row {
  display: flex;
  gap: 4px;
}

.menu-row button {
  flex: 1;
  padding: 12px 0;
  font-size: 16px;
  background: #ffcb05;
  border: 2px solid #333;
  border-radius: 6px;
  cursor: pointer;
  box-shadow: 2px 2px 0 #555;
}

.menu-row button:hover {
  background: #ffd34d;
}
/* CATEGORY BUTTONS */
.item-category-buttons {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
  gap: 4px;
  margin-bottom: 6px;
}


.itemCategoryBtn {
  padding: 4px;
  font-size: 11px;
  background: #2196F3;
  color: #fff;
  border: 2px solid #333;
  border-radius: 4px;
  cursor: pointer;
}

.itemCategoryBtn:hover {
  background: #ffae00;
  color: #000;
}

/* ITEM AREA */
#itemCategoryItems {
  margin-top: 4px;
}


/* ================= DARK MODE ================= */
body.dark-mode { background:#222; }
body.dark-mode #gbaScreen { background:#555; }
body.dark-mode .menu-content { background:#555; color:#fff; border-color:#aaa; }
</style>
</head>
<body>

<!-- ================= BUTTONS ================= -->
<button id="viewToggleBtn">🔙 Back to PC View</button>
<button id="menuToggleBtn">☰ Menu</button>

<!-- ================= MENU OVERLAY ================= -->
<div id="menuOverlay">
  <div class="menu-content">
    
    <!-- Menu Bar -->
    <div class="menu-bar">
      <button class="menu-tab" data-section="mapSection">Map</button>
      <button class="menu-tab" data-section="shopSection">Shop</button>
      <button class="menu-tab" data-section="storageSection">Storage</button>
      <button class="menu-tab" data-section="playerSection">Player</button>
    </div>

    <!-- Map Section -->
    <div id="mapSection" class="menu-section">
      <h3>Map</h3>
      <div id="regionButtons">
      
      </div>
      <div id="mapButtons">
       
      </div>
    </div>

    <!-- Shop Section -->
    <div id="shopSection" class="menu-section">
      <h3>Shop</h3>
      <div id="shopItems">
        <button>Pokéball</button>
        <button>Great Ball</button>
        <button>Razz Berry</button>
      </div>
      <p id="playerCoins">Coins: 50</p>
    </div>

    <!-- Storage Section -->
    <div id="storageSection" class="menu-section">
      <h3>Storage</h3>
      <div id="storageDisplay">
        <button>View Box 1</button>
        <button>View Box 2</button>
      </div>
    </div>

    <!-- Player Section -->
    <div id="playerSection" class="menu-section">
      <h3>Player</h3>
      <div id="playerDisplay">Lv: 5 | EXP: 0 | Coins: 100</div>
      <div class="player-buttons">
         <button onclick="healAllPokemon()">Heal All </button>
     <button onclick="saveGame()">Save</button>
    <button onclick="loadGame()">Load</button>
    <button onclick="clearSave()">Clear Save</button>
 <button onclick="toggleDarkMode()">🌓 Dark Mode</button>
      </div>
    </div>

  </div>
</div>


<!-- ================= GBA SCREEN ================= -->
<div id="gbaScreen">
  <div class="gba-shell">

    <!-- Battle -->
    <div class="battle-container">
      <!-- Enemy -->
      <div class="enemy-container">
        <img id="wildSprite" class="pokemon-sprite enemy-sprite" alt="">
        <div class="hp-box enemy-hp-box">
          <div class="name-level"><span id="wildName">—</span> Lv:<span id="wildLevel">0</span> <span id="wildCP">• CP 0</span></div>
          <div class="bars-row">
            <div class="hp-bar-outer"><div id="enemyHPBar" class="hp-bar-inner hp-green"></div></div>
            <div class="hp-bar-outer"><div id="enemyEnergyBar" class="hp-bar-inner hp-blue"></div></div>
          </div>
          <div class="hp-text"><span id="enemyHP">0</span>/<span id="enemyHPMax">0</span></div>
        </div>
      </div>

      <!-- Player -->
      <div class="player-container">
        <img id="playerSprite" class="pokemon-sprite player-sprite" alt="">
        <img id="pokeballThrow"  alt="" src="img/greatball.png" 
          style="position:absolute; left:-50%; top:70%; width:40px; height:40px; transform:translateX(-50%) translateY(0); display:none;" alt="Pokéball">
        <div class="hp-box player-hp-box">
          <div class="name-level"><span id="activeName">—</span> Lv:<span id="activeLevel">0</span> <span id="playerCP">• CP 0</span></div>
          <div class="bars-row">
            <div class="hp-bar-outer"><div id="playerHPBar" class="hp-bar-inner hp-green"></div></div>
            <div class="hp-bar-outer"><div id="playerEnergyBar" class="hp-bar-inner hp-blue"></div></div>
          </div>
          <div class="hp-text"><span id="playerHP">0</span>/<span id="playerHPMax">0</span></div>
        </div>
      </div>
    </div>

  <!-- Message box -->
<div class="message-box" id="battleMessage">Welcome to Pokémon!</div>

<!-- Battle / Moves Menu -->
<div class="moves-box">

  <!-- Search Wild -->
  <div class="menu-row">
    <button onclick="encounterWild()">Search Wild</button>
  </div>

  <!-- Main Battle Menu (visible by default) -->
  <div id="battleMenu" class="battle-submenu" style="display:flex;">
    <div class="menu-row">
      <button onclick="showFightMenu()">FIGHT</button>
      <button onclick="showBagMenu()">BAG</button>
    </div>
    <div class="menu-row">
      <button onclick="showPokemonMenu()">POKÉMON</button>
      <button onclick="playerTurn('flee')">RUN</button>
    </div>
  </div>

  <!-- Fight Menu (hidden initially) -->
  <div id="fightMenu" class="battle-submenu" style="display:none;">
    <div class="menu-row">
      <button id="move0" onclick="playerTurn('attack',{moveIndex:0})">—</button>
      <button id="move1" onclick="playerTurn('attack',{moveIndex:1})">—</button>
    </div>
    <div class="menu-row">
      <button id="move2" onclick="playerTurn('attack',{moveIndex:2})">—</button>
      <button id="move3" onclick="playerTurn('attack',{moveIndex:3})">—</button>
    </div>
    <div class="menu-row">
      <button onclick="backToBattleMenu()">BACK</button>
    </div>
  </div>
<div id="bagMenu" class="battle-submenu" style="display:none;">
  <!-- Category Buttons -->
  <div class="item-category-buttons" id="itemCategories"></div>

  <!-- Items Grid -->
  <div id="itemsDisplay" style="display:grid; grid-template-columns: repeat(2, 1fr); gap:4px;"></div>

  <div class="menu-row">
    <button onclick="backToBattleMenu()">BACK</button>
  </div>
</div>


  <!-- Pokémon Menu (hidden initially) -->
  <div id="pokemonMenu" class="battle-submenu" style="display:none;">
    <div id="partyDisplay">Party Pokémon here</div>
    <div class="menu-row">
      <button onclick="backToBattleMenu()">BACK</button>
    </div>
  </div>
</div>
</div>
</div>
<script>
// ================= BACK BUTTON =================
document.getElementById('viewToggleBtn').onclick = () => {
  window.location.href = 'index.html';
};





// ================= MENU OVERLAY / MENU BAR =================
const menuBarBtn = document.getElementById('menuToggleBtn');
const menuOverlay = document.getElementById('menuOverlay');
const menuTabs = document.querySelectorAll('.menu-tab');
const menuSections = document.querySelectorAll('.menu-section');

// Toggle overlay menu
menuBarBtn.addEventListener('click', () => {
  menuOverlay.style.display = menuOverlay.style.display === 'flex' ? 'none' : 'flex';
});

// Close overlay if click outside content
menuOverlay.addEventListener('click', e => {
  if(e.target === menuOverlay) menuOverlay.style.display = 'none';
});

// Menu tab switching
menuSections.forEach(section => section.style.display = 'none'); // hide all initially
menuTabs.forEach(tab => {
  tab.addEventListener('click', () => {
    const targetId = tab.dataset.section;
    menuSections.forEach(section => {
      section.style.display = (section.id === targetId) ? 'block' : 'none';
    });
  });
});

// ================= DARK MODE =================
function toggleDarkMode() {
  document.body.classList.toggle('dark-mode');
  localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
}
if(localStorage.getItem('darkMode')==='true') {
  document.body.classList.add('dark-mode');
}

// ================= BATTLE MENUS =================
const battleMenu = document.getElementById('battleMenu');
const fightMenu = document.getElementById('fightMenu');
const bagMenu = document.getElementById('bagMenu');
const pokemonMenu = document.getElementById('pokemonMenu');

function hideAllBattleSubmenus() {
  fightMenu.style.display = 'none';
  bagMenu.style.display = 'none';
  pokemonMenu.style.display = 'none';
}

function showBattleMenu() {
  hideAllBattleSubmenus();
  battleMenu.style.display = 'flex';
}

function showFightMenu() {
  hideAllBattleSubmenus();
  battleMenu.style.display = 'none';
  fightMenu.style.display = 'flex';
}

// ================= BAG RENDER =================
function showBagMenu() {
  hideAllBattleSubmenus();
  battleMenu.style.display = 'none';
  bagMenu.style.display = 'flex';

  // Call renderBagItems instead of old updateItemsDisplay
  renderBagItems();
}



function showPokemonMenu() {
  hideAllBattleSubmenus();
  battleMenu.style.display = 'none';
  pokemonMenu.style.display = 'flex';
}

function backToBattleMenu() {
  showBattleMenu();
}
document.querySelectorAll('.map-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const route = btn.dataset.route;
    selectRoute(route);
    menuOverlay.style.display = 'none';
  });
});



// Initialize battle menu on page load
document.addEventListener('DOMContentLoaded', () => {
  showBattleMenu();
});

</script>



<script src="data/movesdb.js"></script>
<script src="data/pokemondb.js"></script>
<script src="data/pokemonImages.js"></script>
<script src="data/routes.js"></script>
<script src="js/game.js"></script>
<script src="js/battle.js"></script>
<script src="js/journey.js"></script>
<script src="js/player.js"></script>
<script src="js/item.js"></script>
<script src="util/settings.js"></script>

</body>
</html>
